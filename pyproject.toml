[project]
name = "local-personal-agent-runtime"
version = "0.1.0"
description = "本地优先个人 Agent Runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "prompt-toolkit>=3.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "mcp>=1.12.0,<2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
babyface = "personal_agent.main:app"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["personal_agent*"]
